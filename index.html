<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"/>
<title>Dashboard เล่มศึกษา | สชป.8</title>
<style>
:root{--primary:#1F4E79;--primary2:#2E6BA0;--bg:#f0f3f8;--card:#fff;--border:#e2e8f0;--muted:#64748b;--text:#0f172a;--s1:#94a3b8;--s2:#64748b;--s3:#f59e0b;--s4:#f97316;--s5:#22c55e;--s6:#3b82f6;--s7:#ef4444;--special:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Sarabun","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;min-height:100dvh}
header{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:.85rem 1rem}
header h1{font-size:1.15rem;font-weight:700}
header p{font-size:.8rem;opacity:.9;margin-top:.12rem}
.live{display:inline-block;background:#dcfce7;color:#166534;font-size:.68rem;font-weight:600;padding:.1rem .4rem;border-radius:999px;margin-left:.25rem}
.wrap{max-width:1200px;margin:0 auto;padding:.75rem .75rem 1.5rem}
.status-bar{font-size:.8rem;margin-bottom:.55rem;color:var(--muted)}
.status-bar.ok{color:#166534}.status-bar.err{color:#b91c1c}
.filters{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.5rem;align-items:flex-end}
.filters .fg{display:flex;flex-direction:column;gap:.12rem;flex:1 1 120px;min-width:0}
.filters label{font-size:.68rem;color:var(--muted);font-weight:600}
.filters select,.filters input{padding:.4rem .55rem;border:1px solid var(--border);border-radius:8px;font-size:.88rem;background:#fff;width:100%;min-height:40px}
.btn-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.65rem}
.btn{padding:.42rem .7rem;border:none;border-radius:8px;font-size:.84rem;font-weight:600;cursor:pointer;background:#e2e8f0;color:#334155;min-height:40px}
.btn:hover{background:#cbd5e1}
.btn-xl{background:#15803d;color:#fff}
.btn-primary{background:var(--primary);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.7rem}
.kpi .box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.65rem .7rem;text-align:center}
.kpi .box .n{font-size:1.4rem;font-weight:700;line-height:1.1}
.kpi .box .l{font-size:.7rem;color:var(--muted);margin-top:.12rem}
.kpi .box.blue .n{color:var(--primary)}.kpi .box.green .n{color:var(--s5)}.kpi .box.amber .n{color:var(--s3)}.kpi .box.violet .n{color:var(--special)}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:.6rem;margin-bottom:.6rem}
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem .8rem}
.panel h2{font-size:.9rem;font-weight:700;margin-bottom:.5rem;color:var(--primary)}
.panel h2 .sub{font-size:.7rem;font-weight:500;color:var(--muted)}
.pipeline{display:flex;flex-direction:column;gap:.32rem}
.pipe-row{display:grid;grid-template-columns:90px 1fr 30px;align-items:center;gap:.4rem}
.pipe-row .name{font-size:.76rem;font-weight:600}
.pipe-row .bar-bg{height:13px;background:#f1f5f9;border-radius:999px;overflow:hidden}
.pipe-row .bar{height:100%;border-radius:999px}
.pipe-row .cnt{font-size:.76rem;font-weight:700;text-align:right}
.bar.ยังไม่ดูงาน{background:var(--s1)}.bar.ดูงาน{background:var(--s2)}.bar.เล่มร่าง{background:var(--s3)}.bar.เสนอ{background:var(--s4)}.bar.อนุมัติ{background:var(--s5)}.bar.เก็บเข้าคลัง{background:var(--s6)}.bar.ยกเลิก{background:var(--s7)}
.year-cards{display:flex;gap:.45rem;flex-wrap:wrap}
.year-card{flex:1;min-width:100px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:.55rem .7rem;text-align:center;cursor:pointer;user-select:none}
.year-card:hover{border-color:var(--primary)}
.year-card.active{background:var(--primary);border-color:var(--primary);color:#fff}
.year-card.active .yn,.year-card.active .yl,.year-card.active .ys{color:#fff}
.year-card .yn{font-size:1.2rem;font-weight:700;color:var(--primary)}
.year-card .yl{font-size:.72rem;color:var(--muted)}
.year-card .ys{font-size:.68rem;margin-top:.15rem;color:var(--muted)}
.proj-list{display:flex;flex-direction:column;gap:.22rem;max-height:240px;overflow:auto}
.proj-item{display:grid;grid-template-columns:1fr 28px;gap:.35rem;align-items:center;padding:.22rem 0;border-bottom:1px solid #f1f5f9}
.proj-item .pn{font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-item .pc{font-size:.78rem;font-weight:700;text-align:right;color:var(--primary)}
.extra-row{display:flex;justify-content:space-between;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #f1f5f9;font-size:.82rem}
.table-scroll{overflow:auto;max-height:50vh}
.mini-table{width:100%;border-collapse:collapse;font-size:.76rem;min-width:700px}
.mini-table th{text-align:left;padding:.38rem .45rem;background:#f8fafc;border-bottom:1px solid var(--border);font-weight:600;color:var(--muted);font-size:.68rem;white-space:nowrap;position:sticky;top:0}
.mini-table td{padding:.36rem .45rem;border-bottom:1px solid #f1f5f9}
.st{display:inline-block;padding:.08rem .32rem;border-radius:999px;font-size:.66rem;font-weight:600;color:#fff}
.st.ยังไม่ดูงาน{background:var(--s1)}.st.ดูงาน{background:var(--s2)}.st.เล่มร่าง{background:var(--s3)}.st.เสนอ{background:var(--s4)}.st.อนุมัติ{background:var(--s5)}.st.เก็บเข้าคลัง{background:var(--s6)}.st.ยกเลิก{background:var(--s7)}
.sp{display:inline-block;background:#ede9fe;color:#6d28d9;font-size:.6rem;font-weight:700;padding:.05rem .22rem;border-radius:4px;margin-left:.15rem}
.pdf-btn{display:inline-block;padding:.18rem .42rem;background:#e0f2fe;color:#0369a1;border-radius:6px;text-decoration:none;font-size:.7rem;font-weight:600}
.pdf-off{font-size:.7rem;color:#94a3b8}
.tag{display:inline-block;background:#dbeafe;color:#1e40af;font-size:.72rem;font-weight:600;padding:.1rem .45rem;border-radius:999px;margin-left:.25rem}
footer{text-align:center;padding:1rem .75rem;color:var(--muted);font-size:.72rem}
.full{grid-column:1/-1}
.filter-hint{font-size:.75rem;color:var(--muted);margin-bottom:.5rem}
@media(max-width:700px){
  .filters .fg{flex:1 1 100%}.btn{width:100%}.btn-row .btn{flex:1}
  .kpi{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>Dashboard ติดตามเล่มศึกษาความเหมาะสม <span class="live">● Google Sheets</span></h1>
  <p>สำนักงานชลประทานที่ 8 (สชป.8)</p>
</header>
<div class="wrap">
  <div class="status-bar" id="loadStatus">กำลังโหลดจาก Google Sheets...</div>
  <div class="filters">
    <div class="fg"><label>ปี</label><select id="fYear"><option value="">ทุกปี</option></select></div>
    <div class="fg"><label>โครงการ</label><select id="fProject"><option value="">ทุกโครงการ</option></select></div>
    <div class="fg"><label>สถานะ</label>
      <select id="fStatus">
        <option value="">ทุกสถานะ</option>
        <option value="ยังไม่ดูงาน">ยังไม่ดูงาน</option>
        <option value="ดูงาน">ดูงาน</option>
        <option value="เล่มร่าง">เล่มร่าง</option>
        <option value="เสนอ">เสนอ</option>
        <option value="อนุมัติ">อนุมัติ</option>
        <option value="เก็บเข้าคลัง">เก็บเข้าคลัง</option>
        <option value="ยกเลิก">ยกเลิก</option>
      </select>
    </div>
    <div class="fg"><label>ผู้รับผิดชอบ</label><select id="fOwner"><option value="">ทุกคน</option></select></div>
    <div class="fg"><label>ค้นหาชื่อ / รหัสเล่ม</label><input type="text" id="fSearch" placeholder="พิมพ์ชื่อหรือรหัส..."/></div>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="resetF()">ล้างตัวกรอง</button>
    <button class="btn btn-primary" onclick="loadData()">รีเฟรชข้อมูล</button>
    <button class="btn btn-xl" onclick="downloadExcel()">ดาวน์โหลด Excel</button>
  </div>
  <div id="app"></div>
</div>
<footer>Dashboard เล่มศึกษา · สชป.8</footer>
<script>
const SHEET_ID = '1LCS4weKPllm1oFUacENwYG1YHjq1bXYVrm5j-bZvkp8';
const SHEET_GID = '1213199734';

let DATA = [];
let year = '', project = '', status = '', owner = '', search = '';

/** แปลงค่า cell จาก gviz */
function cellVal(c) {
  if (!c) return '';
  if (c.f != null && c.f !== '') return String(c.f);
  if (c.v == null) return '';
  return String(c.v);
}

/** callback สำหรับ JSONP ของ Google Visualization */
function onSheetResponse(response) {
  try {
    if (!response || !response.table) throw new Error('รูปแบบข้อมูลไม่ถูกต้อง');
    const cols = (response.table.cols || []).map(c => (c.label || c.id || '').trim());
    const rows = response.table.rows || [];
    const idx = (name) => cols.indexOf(name);
    // เผื่อ header อยู่แถวแรกของ rows
    let start = 0;
    const iY = idx('ปี') !== -1 ? idx('ปี') : 1;
    const iSeq = idx('ลำดับในปี') !== -1 ? idx('ลำดับในปี') : 2;
    const iCode = idx('รหัสเล่ม') !== -1 ? idx('รหัสเล่ม') : 3;
    const iName = idx('ชื่อโครงการ') !== -1 ? idx('ชื่อโครงการ') : 4;
    const iProj = idx('โครงการ') !== -1 ? idx('โครงการ') : 5;
    const iSt = idx('สถานะ') !== -1 ? idx('สถานะ') : 6;
    const iOwn = idx('ผู้รับผิดชอบ') !== -1 ? idx('ผู้รับผิดชอบ') : 7;
    const iDate = idx('วันอนุมัติ') !== -1 ? idx('วันอนุมัติ') : 8;
    const iPdf = idx('ลิงก์ PDF') !== -1 ? idx('ลิงก์ PDF') : 10;

    const out = [];
    for (let r = start; r < rows.length; r++) {
      const cells = rows[r].c || [];
      const y = cellVal(cells[iY]).trim();
      if (!y || y === 'ปี') continue;
      const code = cellVal(cells[iCode]).trim();
      const name = cellVal(cells[iName]).trim();
      let st = cellVal(cells[iSt]).trim();
      if (!st) st = 'ยังไม่ดูงาน';
      out.push({
        year: y,
        seq: cellVal(cells[iSeq]).trim(),
        code: code,
        name: name,
        project: cellVal(cells[iProj]).trim(),
        status: st,
        owner: cellVal(cells[iOwn]).trim(),
        approveDate: cellVal(cells[iDate]).trim(),
        pdf: cellVal(cells[iPdf]).trim(),
        isSpecial: code.indexOf('-พ-') !== -1 || code.indexOf('พ-') !== -1
      });
    }
    DATA = out;
    const stEl = document.getElementById('loadStatus');
    stEl.className = 'status-bar ok';
    stEl.textContent = 'เชื่อม Google Sheets แล้ว · ' + DATA.length + ' รายการ · ' + new Date().toLocaleString('th-TH');
    buildFilters();
    render();
  } catch (err) {
    showError(err.message || String(err));
  }
}

function showError(msg) {
  const stEl = document.getElementById('loadStatus');
  stEl.className = 'status-bar err';
  stEl.textContent = 'โหลดไม่สำเร็จ: ' + msg;
  document.getElementById('app').innerHTML =
    '<div class="panel">' +
    '<p><strong>ยังดึงข้อมูลจากชีตนี้ไม่ได้</strong></p>' +
    '<ol style="margin:0.6rem 0 0 1.2rem;font-size:0.9rem;color:#475569;line-height:1.7">' +
    '<li>เปิด <a target="_blank" href="https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit">Google Sheets</a></li>' +
    '<li>กด <b>แชร์</b> → ตั้งเป็น <b>ทุกคนที่มีลิงก์</b> = <b>ผู้ดู</b></li>' +
    '<li>หรือเมนู <b>ไฟล์ → แชร์ → เผยแพร่ไปยังเว็บ</b> แล้วกดเผยแพร่</li>' +
    '<li>จากนั้นกดปุ่ม <b>รีเฟรชข้อมูล</b> ด้านบน</li>' +
    '</ol></div>';
}

function loadData() {
  document.getElementById('loadStatus').className = 'status-bar';
  document.getElementById('loadStatus').textContent = 'กำลังโหลดจาก Google Sheets...';
  const old = document.getElementById('gsheetLoader');
  if (old) old.remove();
  if (window.__sheetTimer) clearTimeout(window.__sheetTimer);
  window.__sheetTimer = setTimeout(function() {
    if (!DATA.length) showError('หมดเวลาโหลด — ต้องแชร์ชีตเป็นทุกคนที่มีลิงก์ (ผู้ดู)');
  }, 15000);
  // JSONP callback ชื่อคงที่ — ไม่เขียนทับแบบ recursive
  window.handleSheetData = function(resp) {
    if (window.__sheetTimer) clearTimeout(window.__sheetTimer);
    onSheetResponse(resp);
  };
  const s = document.createElement('script');
  s.id = 'gsheetLoader';
  s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
    '/gviz/tq?tqx=responseHandler:handleSheetData&tq=' + encodeURIComponent('select *') +
    '&gid=' + SHEET_GID + '&headers=1&t=' + Date.now();
  s.onerror = function() {
    showError('โหลดสคริปต์จาก Google ไม่สำเร็จ — ตรวจการแชร์ชีต');
  };
  document.body.appendChild(s);
}

function isStuck(d){ return !d.name || ['ยังไม่ดูงาน','ดูงาน','เล่มร่าง'].indexOf(d.status) !== -1; }
function isDone(d){ return d.name && ['เสนอ','อนุมัติ','เก็บเข้าคลัง'].indexOf(d.status) !== -1; }

function filtered(){
  const q = search.trim().toLowerCase();
  return DATA.filter(d => {
    if (year && String(d.year) !== String(year)) return false;
    if (project && d.project !== project) return false;
    if (status && d.status !== status) return false;
    if (owner && d.owner !== owner) return false;
    if (q) {
      const t = ((d.name||'')+' '+(d.code||'')+' '+(d.project||'')+' '+(d.owner||'')).toLowerCase();
      if (t.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function csvEscape(v){
  const s = String(v == null ? '' : v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function downloadExcel(){
  const rows = filtered();
  const headers = ['ลำดับ','ปี','รหัสเล่ม','ชื่อโครงการ','โครงการ','สถานะ','ผู้รับผิดชอบ','วันอนุมัติ','ลิงก์ PDF'];
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(d => lines.push([d.seq,d.year,d.code,d.name,d.project,d.status,d.owner,d.approveDate,d.pdf].map(csvEscape).join(',')));
  const bom = String.fromCharCode(0xFEFF);
  const blob = new Blob([bom + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'เล่มศึกษา_' + (year || 'ทุกปี') + '_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function buildFilters(){
  const ys = document.getElementById('fYear');
  const ps = document.getElementById('fProject');
  const os = document.getElementById('fOwner');
  const yK = ys.value, pK = ps.value, oK = os.value;
  ys.innerHTML = '<option value="">ทุกปี</option>';
  ps.innerHTML = '<option value="">ทุกโครงการ</option>';
  os.innerHTML = '<option value="">ทุกคน</option>';
  [...new Set(DATA.map(d => String(d.year)))].sort().forEach(y => { const o=document.createElement('option'); o.value=y; o.textContent=y; ys.appendChild(o); });
  [...new Set(DATA.map(d => d.project).filter(Boolean))].sort().forEach(p => { const o=document.createElement('option'); o.value=p; o.textContent=p; ps.appendChild(o); });
  [...new Set(DATA.map(d => d.owner).filter(Boolean))].sort().forEach(p => { const o=document.createElement('option'); o.value=p; o.textContent=p; os.appendChild(o); });
  ys.value = yK; ps.value = pK; os.value = oK;
}

function render(){
  const rows = filtered();
  const total = rows.length;
  const pending = rows.filter(isStuck).length;
  const done = rows.filter(isDone).length;
  const special = rows.filter(d => d.isSpecial).length;
  const named = rows.filter(d => d.name).length;
  const progress = named ? Math.round(done / named * 100) : 0;

  let html = '<div class="kpi">'+
    '<div class="box blue"><div class="n">'+total+'</div><div class="l">งานทั้งหมด</div></div>'+
    '<div class="box amber"><div class="n">'+pending+'</div><div class="l">คงเหลือ</div></div>'+
    '<div class="box green"><div class="n">'+done+'</div><div class="l">อนุมัติ</div></div>'+
    '<div class="box violet"><div class="n">'+special+'</div><div class="l">เล่มพิเศษ (พ)</div></div></div>';

  const order = ['ยังไม่ดูงาน','ดูงาน','เล่มร่าง','เสนอ','อนุมัติ','เก็บเข้าคลัง','ยกเลิก'];
  const counts = {}; order.forEach(s => counts[s]=0);
  rows.forEach(d => { if (counts[d.status] !== undefined) counts[d.status]++; });
  const maxC = Math.max(1, ...Object.values(counts));
  html += '<div class="grid"><div class="panel"><h2>สถานะงาน</h2><div class="pipeline">';
  order.forEach(s => {
    const c = counts[s]||0;
    html += '<div class="pipe-row"><div class="name">'+s+'</div><div class="bar-bg"><div class="bar '+s+'" style="width:'+Math.round(c/maxC*100)+'%"></div></div><div class="cnt">'+c+'</div></div>';
  });
  html += '</div></div>';

  const baseForYear = DATA.filter(d => {
    if (project && d.project !== project) return false;
    if (status && d.status !== status) return false;
    if (owner && d.owner !== owner) return false;
    return true;
  });
  const yc = {};
  baseForYear.forEach(d => { yc[d.year]=(yc[d.year]||0)+1; });
  html += '<div class="panel"><h2>เปรียบเทียบตามปี <span class="sub">คลิกเพื่อกรอง</span></h2><div class="year-cards" id="yearCards">';
  Object.keys(yc).sort().forEach(y => {
    const yrows = baseForYear.filter(d => String(d.year)===String(y));
    const fin = yrows.filter(isDone).length;
    const stuck = yrows.filter(isStuck).length;
    const active = String(year)===String(y) ? ' active' : '';
    html += '<div class="year-card'+active+'" data-year="'+y+'"><div class="yn">'+yc[y]+'</div><div class="yl">ปี '+y+'</div><div class="ys">อนุมัติ '+fin+' · คงเหลือ '+stuck+'</div></div>';
  });
  html += '</div></div></div>';

  const pc = {};
  rows.forEach(d => { const p=d.project||'(ยังไม่ระบุ)'; pc[p]=(pc[p]||0)+1; });
  html += '<div class="grid"><div class="panel"><h2>จำนวนตามโครงการ</h2><div class="proj-list">';
  Object.entries(pc).sort((a,b)=>b[1]-a[1]).forEach(([p,c]) => {
    html += '<div class="proj-item"><div class="pn" title="'+p+'">'+p+'</div><div class="pc">'+c+'</div></div>';
  });
  const noPdf = rows.filter(d => d.name && !d.pdf).length;
  html += '</div></div><div class="panel"><h2>สรุปเพิ่มเติม</h2>';
  html += '<div class="extra-row"><span>ยังไม่แนบ PDF</span><strong>'+noPdf+'</strong></div>';
  html += '<div class="extra-row"><span>คงเหลือ</span><strong>'+pending+'</strong></div>';
  html += '<div class="extra-row"><span>ความคืบหน้า (ถึงขั้นเสนอขึ้นไป)</span><strong>'+progress+'%</strong></div></div></div>';

  let countHtml = '('+rows.length+' รายการ)';
  if (year) countHtml += ' <span class="tag">ปี '+year+'</span>';
  if (owner) countHtml += ' <span class="tag">'+owner+'</span>';
  if (status) countHtml += ' <span class="tag">'+status+'</span>';

  html += '<div class="panel full"><h2>รายการ <span class="sub">'+countHtml+'</span></h2><div class="table-scroll"><table class="mini-table"><thead><tr>';
  html += '<th>ลำดับ</th><th>ปี</th><th>รหัสเล่ม</th><th>ชื่อโครงการ</th><th>โครงการ</th><th>สถานะ</th><th>ผู้รับผิดชอบ</th><th>วันอนุมัติ</th><th>ลิงก์</th></tr></thead><tbody>';
  rows.slice(0,150).forEach(d => {
    html += '<tr><td style="text-align:center">'+(d.seq||'—')+'</td><td style="text-align:center">'+d.year+'</td>';
    html += '<td>'+(d.code||'—')+(d.isSpecial?'<span class="sp">พิเศษ</span>':'')+'</td>';
    html += '<td>'+(d.name||'<span style="color:#94a3b8">—</span>')+'</td><td>'+(d.project||'—')+'</td>';
    html += '<td><span class="st '+d.status+'">'+d.status+'</span></td><td>'+(d.owner||'—')+'</td><td>'+(d.approveDate||'—')+'</td>';
    html += '<td>'+(d.pdf?'<a class="pdf-btn" href="'+d.pdf+'" target="_blank">เปิด PDF</a>':'<span class="pdf-off">ไม่มีลิงก์</span>')+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  document.getElementById('app').innerHTML = html;
  document.querySelectorAll('#yearCards .year-card').forEach(el => {
    el.onclick = function(){
      const y = this.getAttribute('data-year');
      year = (String(year)===String(y)) ? '' : y;
      document.getElementById('fYear').value = year;
      render();
    };
  });
}

function resetF(){
  year=''; project=''; status=''; owner=''; search='';
  document.getElementById('fYear').value='';
  document.getElementById('fProject').value='';
  document.getElementById('fStatus').value='';
  document.getElementById('fOwner').value='';
  document.getElementById('fSearch').value='';
  render();
}

document.getElementById('fYear').onchange=function(){ year=this.value; render(); };
document.getElementById('fProject').onchange=function(){ project=this.value; render(); };
document.getElementById('fStatus').onchange=function(){ status=this.value; render(); };
document.getElementById('fOwner').onchange=function(){ owner=this.value; render(); };
document.getElementById('fSearch').oninput=function(){ search=this.value; render(); };

loadData();
</script>
</body>
</html>
